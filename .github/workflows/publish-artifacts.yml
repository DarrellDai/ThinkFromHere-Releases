name: Publish verified installers
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
      artifacts:
        description: JSON list of temporary artifact URLs and SHA-256 digests
        required: true
permissions:
  contents: write
concurrency:
  group: publish-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Download and verify build artifacts
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_ARTIFACTS: ${{ inputs.artifacts }}
        run: python3 scripts/collect-release.py
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$RELEASE_VERSION" release/* --draft --target gh-pages --title "ThinkFromHere v$RELEASE_VERSION" --notes-file release-notes.md
          gh release edit "v$RELEASE_VERSION" --draft=false --latest
